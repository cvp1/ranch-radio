# Direwolf configuration for use with Ranch Radio's network KISS TNC support.
#
# Ranch Radio's packet hub connects to Direwolf's KISS-over-TCP port
# ("tnc": "tcp:<host>:8001" in the host file). Direwolf owns the sound card
# and modem; the hub owns the APRS store, the web page, transmit safety and
# the AGWPE/KISS ports for Pat and other clients.
#
# Replace everything in CAPS or marked "your": callsign, coordinates and the
# sound card. Nothing here transmits on its own until you uncomment a
# PBEACON, DIGIPEAT or iGate line.
#
# Run with:  direwolf -c direwolf.conf -t 0

# --- Sound card ----------------------------------------------------------
# Find yours with `arecord -l` / `aplay -l`. plughw:CARD,DEVICE.
ADEVICE  plughw:1,0
CHANNEL 0

# Direwolf's own callsign, used for its beacons, digipeating and iGate.
# This is independent of the hub's --mycall / "mycall", which is the call the
# hub transmits under.
MYCALL N9ABC-10

MODEM 1200
FIX_BITS 0

# --- What Ranch Radio connects to ----------------------------------------
# KISSPORT is the one the host file points at. AGWPORT is optional: Ranch
# Radio serves its own AGWPE port, so you only need this for other clients
# that talk to Direwolf directly.
#
# Neither port has authentication, and anyone who can reach KISSPORT can
# transmit through your radio. Firewall it to the machine that runs Ranch
# Radio.
#
# The hub itself listens on 127.0.0.1:8000 (AGWPE) and :8001 (KISS), so if
# Direwolf runs on the SAME machine as the hub, give Direwolf different ports
# (for example KISSPORT 8011) and use that port in the host file.
AGWPORT 8000
KISSPORT 8001

# --- Optional: beacon, digipeater, iGate (all OFF) -----------------------
# Uncomment only if you hold the license and want Direwolf itself to
# transmit. Coordinates are DDD^MM.MMN / DDD^MM.MMW.

#PBEACON delay=1 every=30 overlay=S symbol="digi" lat=00^00.00N long=000^00.00W power=5 height=20 gain=3 comment="Direwolf digipeater" via=WIDE1-1,WIDE2-1
#DIGIPEAT 0 0 ^WIDE[3-7]-[1-7]$|^TEST$ ^WIDE[12]-[12]$ TRACE

# iGate to APRS-IS. The passcode is derived from your callsign; get it from
# the APRS-IS passcode generator and keep it out of version control.
#IGSERVER noam.aprs2.net
#IGLOGIN N9ABC YOUR_APRS_IS_PASSCODE
#PBEACON sendto=IG delay=0:30 every=60:00 symbol="igate" overlay=T lat=00^00.00N long=000^00.00W
#IGTXLIMIT 1 10
