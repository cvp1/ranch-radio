# Ranch Radio is not installed as a package (install.sh makes a venv from
# requirements.txt, which stays the one dependency list: the updater reads
# it too). This file holds the minimum Python and the linter's settings.
[project]
name = "ranch-radio"
version = "0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 130
extend-exclude = ["js8/vendor", "tmp"]

[tool.ruff.lint]
# Correctness only, to start: syntax errors and pyflakes (undefined names,
# unused imports and variables, f-strings without placeholders). Style rules
# can come later, one at a time, each with its own cleanup.
select = ["E9", "F"]
