# The test suite on every pull request (and every push to main).
# Required to pass before a pull request can land. It runs with no secrets:
# pull-request code never sees anything private.
name: ci
on:
  pull_request:
  push:
    branches: [main, "ci-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast checks first (~30 s): the linter, every page script parses, nothing
  # personal in the tree, and the pages stay runnable under webguard.CSP.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: ruff (pyproject.toml)
        run: pip install -q ruff==0.17.6 && ruff check --output-format github .
      - name: Page scripts parse (node --check)
        run: python tests/js_syntax_test.py
      - name: Public hygiene
        run: python tests/public_hygiene_test.py
      - name: Pages under the CSP
        run: python tests/xss_hygiene_test.py
  # The documented minimum (README, install.sh: Python 3.12+): the TX safety
  # tests and the ops units on 3.12, so nothing newer slips in unnoticed.
  # Two halves by measured time (~4 min each), so this lane is never the one
  # every pull request waits on.
  py312:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tests:
          - civ_safety_test update_test tx_level_test installer_test tx_state_test affected_test modules_apply_test inventory_test modules_test hostfile_safety_test scaffold_test security_headers_test webguard_test
          - winlink_lane_test tx_stop_test codec_level_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libhamlib-utils
      - name: Python packages
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt -c constraints.txt
      - name: Safety and ops tests
        shell: bash
        run: bash tests/ci/run_list.sh ${{ matrix.tests }}
  # macOS is half the hosts (launchd, CoreAudio): Darwin rendering, the
  # installer and update paths, and the audio import. No real launchctl
  # bootstrap: it needs a GUI session a runner does not have (service.py).
  # Every process starts ~35 s slow on the runner, so the TX tests stay on
  # Linux (shards, py312), where they run at speed.
  # Two halves by measured time (~4.5 min each).
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tests:
          - mac_station_test update_test hostfile_safety_test webguard_test inventory_test modules_test scaffold_test
          - modules_apply_test station_audio_test installer_test security_headers_test
    steps:
      # The runner's host name is a 60-character id that does not resolve:
      # socket.getfqdn() (webguard, at import) waits ~70 s on it, so servers
      # "did not start" in time, and the host-file rules refuse it as a
      # host name (installer_test). A short one that resolves (2026-11-21).
      - name: A short host name that resolves
        run: |
          sudo scutil --set HostName mac-ci
          sudo scutil --set LocalHostName mac-ci
          sudo scutil --set ComputerName mac-ci
          echo "127.0.0.1 mac-ci mac-ci.local" | sudo tee -a /etc/hosts
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt -c constraints.txt
      - name: macOS tests
        shell: bash
        run: bash tests/ci/run_list.sh ${{ matrix.tests }}
  # The suite split eight ways by measured duration (tests/ci/shard.py), each
  # shard on its own runner, so the serial-only tests never share ports or
  # CPU. The runs wait on real radio timers (tune, TX and session limits), not
  # on the CPU, so time comes down by adding runners, never by shortening
  # those waits or running two on one runner (2026-11-26: three at once on
  # one host stretched winlink_listen_test 114 s -> 192 s).
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # the slowest shard takes ~6 min; a hang fails fast
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: System packages (Hamlib for the rigctl contract test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libhamlib-utils
      - name: Python packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -c constraints.txt
          python -m venv ~/.local/share/venvs/benlink
          ~/.local/share/venvs/benlink/bin/pip install -q "benlink @ git+https://github.com/khusmann/benlink@c4b9d22112402ea193d376f412bc028d1778fdb4"
      - name: Public hygiene
        if: matrix.shard == 1
        run: python tests/public_hygiene_test.py
      - name: Test suite
        env:
          CHROME: /usr/bin/google-chrome
          LOGDIR: ${{ runner.temp }}/rr-suite
          RR_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          RR_SENTINEL: 1   # decoy station state in the runner's HOME must survive the suite
        shell: bash      # -o pipefail: the suite's exit status, not tee's
        run: bash tests/run_all.sh | tee "$RUNNER_TEMP/suite.txt"
      - name: Keep this shard's run times
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/rr-suite/durations.tsv
          if-no-files-found: ignore
          retention-days: 7
      # Every failed run's log, whatever it holds. 2026-11-20: this matched
      # ^FAIL|Traceback across all logs, so it printed passing runs that log
      # tracebacks and skipped runs that failed with a one-line SystemExit
      # ("... did not start"): addons_page_test and winlink_vara_test failed
      # three times and never showed why.
      - name: Logs of failed tests
        if: failure()
        run: bash tests/ci/failed_logs.sh "$RUNNER_TEMP/suite.txt" "$RUNNER_TEMP/rr-suite"
  # The one required check: green only when lint, py312, macos and every
  # shard passed, and every run reported a time. Warns (never fails) on a run that got much slower,
  # a new run over 90 s, or shards that drifted apart (tests/ci/shard.py).
  tests:
    needs: [lint, py312, macos, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.py312.result }}" = success
          test "${{ needs.macos.result }}" = success
          test "${{ needs.shard.result }}" = success
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: durations-*
          path: ${{ runner.temp }}/durations
      - name: CI time budget
        run: RR_LIST=1 bash tests/run_all.sh | python3 tests/ci/shard.py check "$RUNNER_TEMP"/durations/*/durations.tsv
