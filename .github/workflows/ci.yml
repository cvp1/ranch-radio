# The test suite on every pull request (and every push to main).
# Required to pass before a pull request can land. It runs with no secrets:
# pull-request code never sees anything private.
name: ci
on:
  pull_request:
  push:
    branches: [main, "ci-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System packages (Hamlib for the rigctl contract test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libhamlib-utils
      - name: Python packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          python -m venv ~/.local/share/venvs/benlink
          ~/.local/share/venvs/benlink/bin/pip install -q "benlink @ git+https://github.com/khusmann/benlink@c4b9d22112402ea193d376f412bc028d1778fdb4"
      - name: Public hygiene
        run: python tests/public_hygiene_test.py
      - name: Test suite
        env:
          CHROME: /usr/bin/google-chrome
          LOGDIR: ${{ runner.temp }}/rr-suite
        # A test that fails once is run once more, and passes only if the rerun
        # passes (flagged as flaky). The safety tests get no second chance.
        run: |
          bash tests/run_all.sh | tee "$RUNNER_TEMP/suite.txt" && exit 0
          rc=0
          for t in $(awk '/^FAIL /{print $2}' "$RUNNER_TEMP/suite.txt"); do
            case "$t" in
              civ_safety*|server_guard_test|hostfile_safety_test|webguard_test|public_hygiene_test)
                echo "::error::$t failed (safety test: no retry)"; rc=1; continue;;
              winlink_lane_g90) cmd=(.venv/bin/python tests/winlink_lane_test.py g90);;
              uvpro_bridge_test) cmd=(~/.local/share/venvs/benlink/bin/python tests/uvpro_bridge_test.py);;
              rigctl_contract) cmd=(bash tests/rigctl_contract.sh);;
              rigctl_contract_g90) cmd=(bash tests/rigctl_contract.sh g90);;
              *) cmd=(.venv/bin/python "tests/$t.py");;
            esac
            if timeout 900 "${cmd[@]}" > "$LOGDIR/$t.retry.log" 2>&1; then
              echo "::warning::$t failed once and passed on retry (flaky)"
            else
              echo "::error::$t failed twice"; rc=1
            fi
          done
          exit $rc
      - name: Logs of failed tests
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/rr-suite/*.log; do
            grep -qE '^FAIL|FAILED|Traceback' "$f" || continue
            echo "::group::$(basename "$f")"; grep -nE -B3 -A6 '^FAIL|Traceback' "$f" | head -120; echo "::endgroup::"
          done
